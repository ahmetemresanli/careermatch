spring.application.name=careermatch

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careermatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security (JWT_SECRET bos ise uygulama her acilista gecici ve guvenli bir anahtar uretir.)
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration=${JWT_EXPIRATION:PT8H}

# Public links used in verification and recovery e-mails
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.tokens.expose-in-response=${EXPOSE_TOKENS:false}

# SMTP is optional in development. MailService logs a warning and continues when disabled.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Optional company enrichment providers
app.company-data.enabled=${COMPANY_DATA_ENABLED:false}
app.company-data.google-api-key=${GOOGLE_PLACES_API_KEY:}
app.company-data.news-api-key=${NEWS_API_KEY:}
app.company-data.cache-minutes=${COMPANY_DATA_CACHE_MINUTES:30}
